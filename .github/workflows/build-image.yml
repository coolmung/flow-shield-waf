name: build-docker-image

# 触发条件：
#   - 推送到 main 分支          -> 打 latest + sha-<short>
#   - 推送 v* 标签（如 v1.2.3） -> 打 1.2.3 + latest + sha-<short>
#   - 手动触发（Actions 页 Run workflow）
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

# 同一 ref 的并发构建直接取消旧的，保留最新一次
concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/flowshield-waf-app
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/app/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions 缓存，main 分支构建可复用，加速后续构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # CI runner 在海外，用官方 PyPI 覆盖 Dockerfile 默认的清华源，更快更稳
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
